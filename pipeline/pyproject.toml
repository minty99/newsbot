[project]
name = "newsbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhwan Kim", email = "me@muhwan.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
newsbot = "newsbot.cli:main"
